<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="theme-color" content="#1b1a24">
		<title>위지란</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	overscroll-behavior: none;   /* no pull-to-refresh when the stick is dragged down */
}

body {
	color: #f3e9dc;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
	/* holding a touch button must not select text, open the callout or flash a tap highlight */
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* loading screen in the start gate's colours and title (not Godot's grey logo splash) */
#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	background-color: #1b1a24;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-loader {
	position: absolute;
	left: 0;
	right: 0;
	bottom: max(10%, calc(env(safe-area-inset-bottom) + 1.5rem));
	width: min(60%, 420px);
	margin: 0 auto;
	display: none;
	text-align: center;
}

#status-text {
	font-size: 1rem;
	letter-spacing: 0.04em;
	margin-bottom: 0.6rem;
	text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

#status-progress {
	-webkit-appearance: none;
	appearance: none;
	display: block;
	width: 100%;
	height: 6px;
	border: 0;
	border-radius: 999px;
	overflow: hidden;
	background: rgba(243, 233, 220, 0.18);
	color: #e45140;
}
#status-progress::-webkit-progress-bar { background: rgba(243, 233, 220, 0.18); border-radius: 999px; }
#status-progress::-webkit-progress-value { background: #e45140; border-radius: 999px; }
#status-progress::-moz-progress-bar { background: #e45140; border-radius: 999px; }

#status-notice {
	display: none;
	background-color: #2a1d24;
	border-radius: 0.6rem;
	border: 1px solid #9b3943;
	color: #f3e9dc;
	font-size: 1rem;
	line-height: 1.5;
	margin: 0 1.5rem;
	max-width: 32rem;
	overflow: auto;
	max-height: 80%;
	padding: 1rem 1.25rem;
	text-align: center;
	z-index: 1;
}

/* shared by the PC and mobile builds. Touch devices only: tap-to-start gate (fullscreen + landscape lock;
   removed at once with a mouse) and a rotate prompt in portrait */
#start, #rotate {
	position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center;
	box-sizing: border-box;
	padding: max(1rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
	background: #1b1a24; color: #f3e9dc; text-align: center; line-height: 1.5; word-break: keep-all;
}
#start { cursor: pointer; }
/* padding-left = letter-spacing: the trailing space after the last glyph would push the text off centre */
#start h1, #status-title { font-size: clamp(2rem, 9vh, 2.8rem); margin: 0 0 0.5rem; letter-spacing: 0.12em; padding-left: 0.12em; font-weight: 700; }
#start p { margin: 0.15rem 0; font-size: clamp(0.95rem, 4.2vh, 1.1rem); color: #d9cbbb; }
#start .btn { margin-top: clamp(0.8rem, 5vh, 1.6rem); padding: 0.8rem 2.6rem 0.8rem calc(2.6rem + 0.06em); border: 2px solid #e45140; border-radius: 999px; color: #fff; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.06em; background: rgba(228,81,64,0.25); }
#start .btn:active { background: rgba(228,81,64,0.5); }
#rotate { display: none; z-index: 30; }
#rotate .phone { width: 34px; height: 60px; border: 3px solid #f0c870; border-radius: 6px; margin-bottom: 1.2rem; animation: turn 1.6s ease-in-out infinite; }
#rotate p { margin: 0.2rem 0; font-size: 1.2rem; font-weight: 700; }
#rotate small { font-size: 1rem; color: #d9cbbb; }
@keyframes turn { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			이 브라우저는 canvas를 지원하지 않습니다.
		</canvas>

		<noscript>
			JavaScript를 켜야 플레이할 수 있습니다.
		</noscript>

		<div id="start">
			<h1>위지란</h1>
			<p>가로 화면 · 터치 조작</p>
			<p>왼쪽 스틱으로 이동 · 조준, 오른쪽 버튼으로 기술</p>
			<div class="btn">탭하여 시작</div>
		</div>
		<div id="rotate"><div class="phone"></div><p>휴대폰을 가로로 돌려 주세요</p><small>가로 화면에서만 플레이할 수 있습니다</small></div>

		<div id="status">
			<h1 id="status-title">위지란</h1>
			<div id="status-loader">
				<div id="status-text">불러오는 중…</div>
				<progress id="status-progress"></progress>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4044796,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

(function () {
	// a long press on a touch button must not open the browser's context menu
	document.addEventListener('contextmenu', (e) => e.preventDefault());
	const startGate = document.getElementById('start');
	const gated = matchMedia('(pointer: coarse)').matches;
	if (!gated) {
		startGate.remove();   // mouse and keyboard: no fullscreen / landscape gate, straight to loading
	}
	startGate.addEventListener('click', () => {
		const el = document.documentElement;
		const fs = el.requestFullscreen || el.webkitRequestFullscreen;
		let p = Promise.resolve();
		if (fs) { try { p = Promise.resolve(fs.call(el)); } catch (e) { p = Promise.resolve(); } }
		p.catch(() => {}).then(() => {
			if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(() => {}); }
		});
		startGate.remove();
		const c = document.getElementById('canvas');
		if (c) { c.focus(); }
	});
	const statusOverlay = document.getElementById('status');
	const statusLoader = document.getElementById('status-loader');
	const statusText = document.getElementById('status-text');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const engine = new Engine(Object.assign({}, GODOT_CONFIG, { onProgress: showProgress }));

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusLoader.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function showProgress(current, total) {
		if (current > 0 && total > 0) {
			statusProgress.value = current;
			statusProgress.max = total;
			statusText.textContent = '불러오는 중… ' + Math.min(100, Math.floor((current / total) * 100)) + '%';
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
			statusText.textContent = '불러오는 중…';
		}
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		const prefix = '게임을 시작하지 못했습니다.\n';
		if (err instanceof Error) {
			setStatusNotice(prefix + err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(prefix + err);
		} else {
			setStatusNotice(prefix + '알 수 없는 오류가 발생했습니다. 새로고침해 주세요.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = '이 브라우저에는 실행에 필요한 기능이 없습니다.\n최신 Chrome 또는 Safari에서 열어 주세요.\n\n';
			setStatusNotice(missingMsg + missing.join('\n'));
			setStatusMode('notice');
			initializing = false;
		}
	} else {
		setStatusMode('progress');
		// engine.startGame() in two steps: download at once, but behind the touch gate run only on its tap, so the
		// first-entry card, map title and opening lines never play unseen (and audio starts with that gesture)
		const pack = GODOT_CONFIG.mainPack || GODOT_CONFIG.executable + '.pck';
		const loaded = Promise.all([engine.init(GODOT_CONFIG.executable), engine.preloadFile(pack, pack)]);
		const run = () => loaded
			.then(() => engine.start({ args: ['--main-pack', pack].concat(GODOT_CONFIG.args || []) }))
			.then(() => setStatusMode('hidden'), displayFailureNotice);
		if (gated) {
			startGate.addEventListener('click', run, { once: true });
		} else {
			run();
		}
	}
}());
		</script>
	</body>
</html>
